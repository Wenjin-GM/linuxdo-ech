[package]
name = "linuxdo_ech_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# 交叉编译到 Android:
#   rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
#   cargo build --release --target aarch64-linux-android
# 产物 liblinuxdo_ech_core.so 放入 app/src/main/jniLibs/<abi>/
# 注意 aws-lc-rs 交叉编译需要 NDK 的 cmake/clang 工具链在 PATH 中。

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["rt", "tokio", "client", "client-legacy", "http1", "http2"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "http2"] }
rcgen = "0.13"
jni = "0.21"
anyhow = "1"
once_cell = "1"
url = "2"
base64 = "0.22"
webpki-roots = "0.26"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
